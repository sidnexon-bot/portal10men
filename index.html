  <!-- MEMBER MODAL -->
  <div id="memberModal" class="modal hidden">
    <div class="modal-backdrop" onclick="closeMemberModal()"></div>
    <div class="modal-content">
      <div class="modal-header">
        <b>Vyber člena</b>
      </div>
      <div id="memberList"></div>
    </div>
  </div>

  <div id="moznaModal" class="modal hidden">
  <div class="modal-backdrop" onclick="closeMoznaModal()"></div>
  <div class="modal-content" style="padding:20px">
    <div class="modal-header">Upřesni docházku</div>
    <input id="moznaReason" placeholder="Důvod (povinné)" style="margin-bottom:16px">
    <div class="btn-group">
      <button onclick="confirmMozna('spise-ano')" style="background:#d4f5e2;color:#1a7a3a">Spíše ano</button>
      <button onclick="confirmMozna('spise-ne')" style="background:#fde8e8;color:#c00">Spíše ne</button>
    </div>
    <div class="btn-group" style="margin-top:8px">
      <button onclick="closeMoznaModal()" style="background:#e8e8ed;color:#6b6b70">Zrušit</button>
    </div>
  </div>
</div>

  <!-- PIN zatím vypnut -->

  <script src="auth.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js"></script>
  <script type="module" src="app.js"></script>

  <!-- FORMULÁŘ -->

  <div id="formModal" class="modal hidden">
  <div class="modal-backdrop" onclick="closeFormModal()"></div>
  <div class="modal-content" style="padding:20px">
    <div id="formModalTitle" class="modal-header"></div>
    <div id="formModalBody"></div>
    <div class="btn-group" style="margin-top:16px">
      <button id="formModalSubmit" style="background:#d4f5e2;color:#1a7a3a">Uložit</button>
      <button onclick="closeFormModal()">Zrušit</button>
    </div>
  </div>
</div>

</div>

<div id="eventFormModal" class="modal hidden">

   <div class="modal-content" style="max-width:560px;max-height:90vh;overflow-y:auto">
    <div id="eventFormModalBody"></div>
  </div>
 </div>

 <div id="programEditorModal" class="modal hidden">
