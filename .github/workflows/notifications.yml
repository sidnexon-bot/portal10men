name: Daily Notifications

on:
  schedule:
    - cron: '0 7 * * *'  # každý den v 7:00 UTC (9:00 Praha)
  workflow_dispatch:      # možnost spustit ručně

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send notifications
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
        run: |
          node -e "
          const https = require('https');

          const FIREBASE_URL = 'https://base-39f52-default-rtdb.europe-west1.firebasedatabase.app';
          const ONESIGNAL_APP_ID = '01477d89-1329-43f6-91f2-bb597d5a681e';

          function fbGet(path){
            return new Promise((resolve, reject) => {
              const url = FIREBASE_URL + path + '.json?auth=' + process.env.FIREBASE_SECRET;
              https.get(url, res => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => resolve(JSON.parse(data)));
              }).on('error', reject);
            });
          }

          function sendNotification(title, message, segments){
            return new Promise((resolve, reject) => {
              const body = JSON.stringify({
                app_id: ONESIGNAL_APP_ID,
                included_segments: segments || ['All'],
                headings: { en: title, cs: title },
                contents: { en: message, cs: message }
              });

              const options = {
                hostname: 'onesignal.com',
                path: '/api/v1/notifications',
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': 'Key ' + process.env.ONESIGNAL_API_KEY
                }
              };

              const req = https.request(options, res => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => { console.log('Notification sent:', data); resolve(data); });
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          async function main(){
            const akce    = await fbGet('/akce');
            const program = await fbGet('/program');
            const dochazka = await fbGet('/dochazka');
            const members = await fbGet('/members');

            if(!akce || !members) return;

            // TEST — smaž po ověření
            await sendNotification(
              'Test shrnutí 📅',
              'Zítra: Zkouška · 19:00 · Smetanovo nábřeží\nSraz: 18:45\nOblečení: Neformální — 10men tričko\n\n18:45 sraz, 19:00 zkouška, 21:00 konec',
              ['All']
            );
            // END TEST

            const now = new Date();
            const events = Object.values(akce);

            // DEBUG
            console.log('Today:', now.toISOString());
            console.log('Events count:', events.length);
            events.forEach(e => {
              const eventDate = new Date(e.date);
              const daysUntil = Math.round((eventDate - now) / (1000 * 60 * 60 * 24));
              console.log(e.name, '- days:', daysUntil, '- date:', e.date);
            });
            // END DEBUG
            
            const progEntries = program ? Object.values(program) : [];
            const dochazkaEntries = dochazka ? Object.values(dochazka) : [];
            const memberList = Object.values(members);

            for(const event of events){
              if(!event.date) continue;
              if(event.status && event.status.indexOf('Zru') === 0) continue;
              const eventDate = new Date(event.date);
              eventDate.setHours(0,0,0,0);
              const todayDate = new Date(now);
              todayDate.setHours(0,0,0,0);
              const daysUntil = Math.ceil((eventDate - todayDate) / (1000 * 60 * 60 * 24));

              // 3 dny před akcí
              if(daysUntil === 3){
              if(event.requires_program !== false){
                const hasProgram = progEntries.some(p => p.id_akce === event.id);
                if(!hasProgram){
                  await sendNotification(
                    'Program chybí 📋',
                    'Akce ' + event.name + ' je za 3 dny a nemá program.',
                    ['All']
                  );
                }
              }
              await sendNotification(
                'Vyplň docházku ✋',
                'Akce ' + event.name + ' je za 3 dny. Zkontroluj si, prosím, docházku.',
                ['All']
              );
            }

            // 1 den před akcí — ping nevyplněných
            if(daysUntil === 1){
            // ping nevyplněných
            const nevyplneni = memberList.filter(m => {
              const zaznam = dochazkaEntries.find(d => d.id_akce === event.id && d.email === m.email);
              return !zaznam || !zaznam.status;
            });
          
            if(nevyplneni.length > 0){
              const jmena = nevyplneni.map(m => m.name).join(', ');
              await sendNotification(
                'Nevyplněná docházka ⚠️',
                'Zítra je ' + event.name + '. Docházku ještě nevyplnili: ' + jmena,
                ['All']
              );
            }
          
            // shrnutí akce
            let shrnuti = 'Zítra: ' + event.name;
            if(event.start)       shrnuti += ' · ' + event.start;
            if(event.place)       shrnuti += ' · ' + event.place;
            if(event.sraz)        shrnuti += '\nSraz: ' + event.sraz;
            if(event.obleceni)    shrnuti += '\nOblečení: ' + event.obleceni;
            if(event.doprava)     shrnuti += '\nDoprava: ' + event.doprava;
            if(event.harmonogram) shrnuti += '\n\n' + event.harmonogram;
          
            await sendNotification(
              'Připomínka na zítra 📅',
              shrnuti,
              ['All']
            );
          }
                        }
            
                        console.log('Done');
                      }
            
                      main().catch(console.error);
                      "
